name: Repack ARMv8 Firmware

# 用已有固件重新打包（不重新编译）。
# 从 Releases 下载上一次构建留下的 rootfs.tar.gz，直接交给 ophub 打包流程出包，
# 只做打包不编译，通常 10 分钟以内完成。
#
# 适用场景：只想换内核版本或换目标设备型号重新出包，
# 而不想重新等 1~3 小时的完整编译。
# 内核仓库、auto_latest 等其余打包参数与构建流一致，直接写死。
#
# 注意：打包结果会覆盖 ARMv8-<源码> 这个 tag 下的资产（与构建流行为一致），
# 并继续保留其中的 rootfs.tar.gz，所以可以反复重新打包。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '要重新打包的固件源码'
        required: true
        default: ImmortalWrt
        type: choice
        options: [ImmortalWrt, LEDE]

      kernel_version:
        description: '内核版本（多个用 _ 分隔）'
        required: false
        default: 6.12.y_6.18.y
        type: string

      package_soc:
        description: '目标设备型号（多个用 _ 分隔）'
        required: false
        default: s905d_r66s
        type: string

jobs:
  repack:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ARMv8-${{ inputs.source }}
      SOURCE: ${{ inputs.source }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download existing rootfs from release
      run: |
        # 资产名形如 <Source>-armsr-armv8-generic-rootfs.tar.gz，放进标准目录后
        # 复用与构建流完全相同的 OPENWRT_ARMSR 通配符
        mkdir -p openwrt/bin/targets/armsr/armv8
        gh release download "$RELEASE_TAG" \
          --pattern '*rootfs.tar.gz' --clobber \
          --dir openwrt/bin/targets/armsr/armv8
        echo "== 用于打包的 rootfs =="
        ls -lh openwrt/bin/targets/armsr/armv8/

    - name: Packaging OpenWrt (flippy)
      id: package_flippy
      uses: ophub/flippy-openwrt-actions@main
      env:
        OPENWRT_ARMSR: openwrt/bin/targets/*/*/*generic-rootfs.tar.gz
        PACKAGE_SOC: ${{ inputs.package_soc || 's905d_r66s' }}
        KERNEL_REPO_URL: breakingbadboy/OpenWrt
        KERNEL_VERSION_NAME: ${{ inputs.kernel_version || '6.12.y_6.18.y' }}
        KERNEL_AUTO_LATEST: true

    - name: Rename Firmware
      id: rename
      if: env.PACKAGED_STATUS == 'success'
      run: |
        cd ${{ env.PACKAGED_OUTPUTPATH }}
        for file in *openwrt*; do
          [ -f "$file" ] || continue
          new_name=$(echo "$file" | sed "s/openwrt/${{ env.SOURCE }}/g")
          mv "$file" "$new_name"
          echo "Renamed: $file -> $new_name"
        done
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release body
      id: body
      if: steps.rename.outputs.status == 'success'
      run: |
        {
          echo "📦 ${{ env.SOURCE }} ARMv8 固件（重新打包，未重新编译）"
          echo "🕐 打包时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "🚀 内核版本: ${{ inputs.kernel_version }}"
          echo "🎯 目标设备: ${{ inputs.package_soc }}"
          echo "📥 rootfs 来源: ${{ env.RELEASE_TAG }} 中上一次构建的 rootfs.tar.gz"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      if: steps.body.outputs.status == 'success'
      uses: ncipollo/release-action@main
      with:
        name: ${{ env.RELEASE_TAG }}
        allowUpdates: true
        removeArtifacts: true
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
        bodyFile: release.txt
