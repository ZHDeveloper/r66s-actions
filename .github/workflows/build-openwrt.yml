name: Build OpenWrt for R66S

on:
  workflow_dispatch:
  schedule:
    - cron: 0 20 * * *

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  TOOLCHAIN_TAG: toolchain

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ImmortalWrt
            build_type: r66s
            repo_url: https://github.com/immortalwrt/immortalwrt
            repo_branch: openwrt-24.10
          - name: LEDE
            build_type: r66s
            repo_url: https://github.com/coolsnowwolf/lede
            repo_branch: master
          - name: ImmortalWrt
            build_type: flippy
            repo_url: https://github.com/immortalwrt/immortalwrt
            repo_branch: openwrt-24.10
          - name: LEDE
            build_type: flippy
            repo_url: https://github.com/coolsnowwolf/lede
            repo_branch: master

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      FIRMWARE_TYPE: ${{ matrix.name }}
      EXTRA_CONFIG: configs/extra.config
      CONFIG_FILE: >-
        ${{
          matrix.build_type == 'flippy' && 'configs/r66s-flippy.config' ||
          matrix.name == 'LEDE' && 'configs/r66s-lede.config' ||
          'configs/r66s-immortalwrt.config'
        }}
      RELEASE_TAG: >-
        ${{
          matrix.build_type == 'flippy' && format('ARMv8-{0}', matrix.name) ||
          format('{0}-R66S', matrix.name)
        }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        docker rmi -f $(docker images -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison btrfs-progs build-essential \
          bzip2 cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip-full patch pkgconf python3 python3-pyelftools \
          libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
          vim wget xmlto xxd zlib1g-dev zstd python3-setuptools
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks
      run: |
        # 确保存在 4GB swap（防止编译 Rust/Go 时因内存耗尽而 OOM 崩溃）
        if [ $(wc -l < /proc/swaps) -le 1 ]; then
          if [ ! -s /swapfile ]; then
            sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile 2>/dev/null || true
        fi

        if mountpoint -q /mnt; then
          mnt_size=$(($(df -k --output=avail /mnt | tail -1) / 1024 - 1024))
          if [ $mnt_size -gt 1024 ]; then
            sudo truncate -s ${mnt_size}M /mnt/mnt.img
            loop_mnt=$(sudo losetup -f --show /mnt/mnt.img)
          fi
        fi
        root_size=$(($(df -k --output=avail / | tail -1) / 1024 - 5120))
        sudo truncate -s ${root_size}M /root.img
        loop_root=$(sudo losetup -f --show /root.img)
        
        loop_devs="$loop_root"
        [ -n "$loop_mnt" ] && loop_devs="$loop_mnt $loop_root"

        sudo pvcreate -f $loop_devs
        sudo vgcreate github $loop_devs
        sudo lvcreate -n runner -l 100%FREE github
        sudo mkfs.btrfs -f /dev/github/runner
        sudo mkdir -p /workdir
        sudo mount -o compress=zstd /dev/github/runner /workdir
        sudo chown -R runner:runner /workdir && df -hT
        free -h

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone ${{ matrix.repo_url }} -b ${{ matrix.repo_branch }} openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Cache Toolchain
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        chmod +x scripts/*
        $GITHUB_WORKSPACE/scripts/toolchain.sh

    - name: Load custom configuration
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        [ -e "$GITHUB_WORKSPACE/$EXTRA_CONFIG" ] && cat "$GITHUB_WORKSPACE/$EXTRA_CONFIG" >> .config
        $GITHUB_WORKSPACE/scripts/custom.sh
        make defconfig

    - name: Compile Toolchain
      if: env.REBUILD_TOOLCHAIN == 'true'
      id: toolchain
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt
        make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s
        $GITHUB_WORKSPACE/scripts/toolchain.sh

    - name: Delete Old Toolchain
      if: steps.toolchain.conclusion == 'success'
      uses: mknejp/delete-release-assets@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.TOOLCHAIN_TAG }}
        assets: '${{ env.FIRMWARE_TYPE }}-${{ env.BUILD_TYPE }}-*'
        fail-if-no-assets: false
        fail-if-no-release: false

    - name: Upload Toolchain To Release
      if: steps.toolchain.conclusion == 'success'
      uses: softprops/action-gh-release@v2
      with:
        name: toolchain-cache
        tag_name: ${{ env.TOOLCHAIN_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        files: output/*
        body: OpenWrt 工具链缓存

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    # ── 固件后处理 ────────────────────────────────────────────────
    - name: Organize firmware (r66s)
      if: steps.compile.outputs.status == 'success' && env.BUILD_TYPE == 'r66s'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
        echo "DEVICE_DESC=FastRhino R66S (RK3568)" >> $GITHUB_ENV
        echo "FIRMWARE_READY=true" >> $GITHUB_ENV

    - name: Packaging OpenWrt (flippy)
      if: steps.compile.outputs.status == 'success' && env.BUILD_TYPE == 'flippy'
      uses: ophub/flippy-openwrt-actions@main
      env:
        OPENWRT_ARMSR: openwrt/bin/targets/*/*/*rootfs.tar.gz
        PACKAGE_SOC: s905d_r66s
        KERNEL_VERSION_NAME: 6.6.y_6.12.y
        KERNEL_AUTO_LATEST: true

    - name: Rename and organize firmware (flippy)
      if: env.PACKAGED_STATUS == 'success' && env.BUILD_TYPE == 'flippy'
      run: |
        cd ${{ env.PACKAGED_OUTPUTPATH }}
        for file in *openwrt*; do
          [ -f "$file" ] || continue
          new_name=$(echo "$file" | sed "s/openwrt/${{ matrix.name }}/g")
          mv "$file" "$new_name"
          echo "Renamed: $file -> $new_name"
        done
        for shafile in *.sha *.sha256 *.md5; do
          [ -f "$shafile" ] || continue
          sed -i "s/openwrt/${{ matrix.name }}/g" "$shafile" 2>/dev/null || true
        done
        echo "FIRMWARE_DIR=${{ env.PACKAGED_OUTPUTPATH }}" >> $GITHUB_ENV
        echo "DEVICE_DESC=FastRhino R66S / ARMv8" >> $GITHUB_ENV
        echo "FIRMWARE_READY=true" >> $GITHUB_ENV

    # ── 统一 Release 发布 ──────────────────────────────────────────
    - name: Generate release metadata
      if: env.FIRMWARE_READY == 'true'
      run: |
        cat << EOF > release.txt
        📦 ${{ matrix.name }} ${{ env.BUILD_TYPE == 'flippy' && 'ARMv8' || 'R66S' }} 固件
        🕐 编译时间: $(date '+%Y-%m-%d %H:%M:%S')
        🌿 源码分支: ${{ matrix.repo_branch }}
        🎯 支持设备: $DEVICE_DESC
        EOF

    - name: Upload firmware to release
      if: env.FIRMWARE_READY == 'true'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        body_path: release.txt
        files: ${{ env.FIRMWARE_DIR }}/*

    # ── 清理 ──────────────────────────────────────────────────────
    - name: Cleanup
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run list --workflow="build-openwrt.yml" --limit 50 --json databaseId --jq '.[10:][].databaseId' | xargs -I {} gh run delete {} 2>/dev/null || true
        gh run list --workflow="build-openwrt.yml" --status failure --limit 20 --json databaseId --jq '.[].databaseId' | xargs -I {} gh run delete {} 2>/dev/null || true
        gh run list --workflow="build-openwrt.yml" --status cancelled --limit 20 --json databaseId --jq '.[].databaseId' | xargs -I {} gh run delete {} 2>/dev/null || true
